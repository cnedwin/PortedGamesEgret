<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101412">
  <meta name="description" content="新白鹭引擎 Egret Rebuild 的可玩游戏案例、最新实机截图和引擎能力源码。">
  <title>新白鹭引擎游戏案例</title>
  <link rel="icon" href="showcase/egret.svg" type="image/svg+xml">
  <link rel="stylesheet" href="showcase/site.css">
</head>
<body>
  <a class="skip-link" href="#content" data-act="skip" data-t="skip">跳到内容</a>
  <header class="bar">
    <div class="bar-inner">
      <a class="brand" href="#/">
        <img src="showcase/egret.svg" alt="" width="38" height="38">
        <span data-t="brand">白鹭游戏案例</span>
      </a>
      <nav class="bar-links" aria-label="站点导航" data-t-label="navigation">
        <a class="matrix-link" href="capabilities.html" data-t="matrix">能力矩阵</a>
        <a class="engine-link" href="https://github.com/cnedwin/Egret_rebuild" data-t="engine">引擎源码</a>
        <button class="lang" type="button" data-act="lang" aria-label="Switch to English">EN</button>
      </nav>
    </div>
  </header>

  <main id="content" tabindex="-1">
    <div id="home">
      <section class="hero shell" aria-labelledby="home-title">
        <div class="hero-copy">
          <h1 id="home-title" tabindex="-1"><span data-t="heroEngine">新白鹭引擎</span><span data-t="heroCases">游戏案例</span></h1>
          <p class="hero-lead" data-t="heroLead">浏览可直接试玩的游戏，查看实机画面和背后的引擎实现。</p>
          <div class="actions">
            <button type="button" class="btn btn-primary" data-act="browse" data-t="browse">浏览游戏</button>
            <a class="btn btn-secondary matrix-link" href="capabilities.html" data-t="matrix">能力矩阵</a>
          </div>
        </div>
        <div class="featured"></div>
      </section>
      <section class="catalog shell" id="catalog" aria-labelledby="catalog-title">
        <div class="catalog-header">
          <div>
            <h2 id="catalog-title" tabindex="-1" data-t="all">全部游戏</h2>
            <p class="catalog-count" aria-live="polite"></p>
          </div>
          <div class="filters" role="group" data-t-label="filterLabel" aria-label="筛选游戏"></div>
        </div>
        <div class="game-grid"></div>
      </section>
      <noscript><p class="shell">启用 JavaScript 后可浏览游戏与截图。You can also browse the project repository below.</p></noscript>
    </div>

    <article id="game" class="case shell" hidden></article>
  </main>

  <dialog class="viewer" aria-label="截图" data-t-label="gallery">
    <figure><img alt=""><figcaption class="viewer-caption" aria-live="polite"></figcaption></figure>
    <button type="button" class="viewer-close" data-act="close" aria-label="关闭" data-t-label="close">×</button>
    <button type="button" class="viewer-step prev" data-act="prev" aria-label="上一张" data-t-label="prev">‹</button>
    <button type="button" class="viewer-step next" data-act="next" aria-label="下一张" data-t-label="next">›</button>
  </dialog>

  <footer class="foot">
    <div class="foot-inner shell">
      <p data-t="foot">新白鹭引擎 · 游戏案例</p>
      <nav aria-label="项目链接" data-t-label="projectLinks">
        <a href="https://github.com/cnedwin/Egret_rebuild" data-t="engine">引擎源码</a>
        <a href="https://github.com/cnedwin/PortedGamesEgret" data-t="repo">游戏源码</a>
      </nav>
    </div>
  </footer>
  <script type="module" src="showcase/site.js"></script>
</body>
</html>
