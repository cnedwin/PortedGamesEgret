<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jelly Pandas</title>
  <meta name="description" content="Jelly Pandas, a 3D action game demo built with Egret Rebuild. / 果冻熊猫：基于新白鹭引擎开发的 3D 动作游戏 Demo。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='4' cy='4' r='3' fill='%231f6b3a'/%3E%3Ccircle cx='12' cy='4' r='3' fill='%231f6b3a'/%3E%3Ccircle cx='8' cy='9' r='6.5' fill='%238fe6a0'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">

  <!-- The engine is a copy inside this folder (see vendor/SOURCE.md), so the game runs from any static host. -->
  <script type="importmap">
{
  "imports": {
    "@egret/contracts": "./vendor/contracts/dist/index.js",
    "@egret/runtime": "./vendor/runtime/dist/index.js",
    "@egret/contracts/resources": "./vendor/contracts/dist/resources/index.js",
    "@egret/engine": "./vendor/engine/dist/index.js",
    "@egret/engine/world3d": "./vendor/engine/dist/rendering/world3d/index.js",
    "@egret/runtime/text": "./vendor/runtime/dist/text/index.js",
    "@egret/engine/text": "./vendor/engine/dist/text.js",
    "@egret/runtime/input": "./vendor/runtime/dist/input/index.js",
    "#egret-pointer-input": "./vendor/engine/dist/pointerInput.js",
    "#egret-keyboard-input": "./vendor/engine/dist/keyboardInput.js",
    "robust-predicates": "./vendor/robust-predicates/index.js",
    "#egret-textured-frame-state": "./vendor/engine/dist/internal/texturedFrameState.js",
    "@egret/engine/input/hover": "./vendor/engine/dist/hover.js",
    "@egret/engine/kit": "./vendor/engine/dist/kit.js",
    "@egret/engine/audio": "./vendor/engine/dist/audio.js",
    "@egret/engine/input/gamepad": "./vendor/engine/dist/gamepad.js",
    "@egret/runtime/ui": "./vendor/runtime/dist/ui/index.js",
    "@egret/engine/ui": "./vendor/engine/dist/ui/index.js",
    "@egret/runtime/paragraph": "./vendor/runtime/dist/paragraph/index.js",
    "@egret/engine/paragraph": "./vendor/engine/dist/paragraph.js",
    "@egret/engine/webgl2/world3d": "./vendor/engine/dist/web/world3d/index.js",
    "@egret/engine/webgpu/world3d": "./vendor/engine/dist/web/world3d/webgpu.js",
    "@egret/engine/ui/semantics": "./vendor/engine/dist/semantics.js",
    "@egret/engine/web/semantics": "./vendor/engine/dist/web/semantics.js",
    "@egret/engine/ui/testing": "./vendor/engine/dist/ui/testing.js",
    "@egret/engine/web/hover": "./vendor/engine/dist/web/hover.js",
    "@egret/engine/input": "./vendor/engine/dist/input.js",
    "@egret/engine/bitmapfont": "./vendor/engine/dist/bitmapfont.js"
  }
}
  </script>
</head>
<body>
  <canvas id="stage" tabindex="0" aria-label="Jelly Pandas game"></canvas>
  <div id="scene-markers" aria-hidden="true" hidden></div>
  <p id="error" role="alert" hidden></p>
  <script type="module">
    const zh = new URLSearchParams(location.search).get('lang') === 'zh' ||
      (!new URLSearchParams(location.search).has('lang') && navigator.language.toLowerCase().startsWith('zh'));
    document.documentElement.lang = zh ? 'zh-CN' : 'en';
    try { await import('./src/main.mjs'); }
    catch (error) {
      // The engine itself may not have loaded. There is no UI host yet.
      const box = document.querySelector('#error');
      box.textContent = zh ? '加载失败。请重新加载页面重试。' : 'Loading failed. Reload the page to retry.';
      box.hidden = false;
      globalThis.__jellyPandas ??= { frames: 0, mode: 'error', error: String(error?.stack ?? error) };
    }
  </script>
</body>
</html>
