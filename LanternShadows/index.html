<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <title>灯影·闹天宫 Lantern Shadows</title>
  <meta name="description" content="一出皮影戏里的横版动作：孙悟空打上南天门。A side-scrolling action demo played as a shadow-puppet show.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <link rel="modulepreload" href="build/lantern.js">
  <!-- Fetched at once. Written by tools/bundle.mjs. -->
  <link rel="preload" as="fetch" crossorigin href="assets/manifest.json">
  <link rel="preload" as="fetch" crossorigin href="assets/levels/act1.tmj">
  <link rel="preload" as="fetch" crossorigin href="assets/scene/frame.png">
  <link rel="preload" as="fetch" crossorigin href="assets/scene/far.png">
  <link rel="preload" as="fetch" crossorigin href="assets/files/wukong.png">
  <link rel="preload" as="fetch" crossorigin href="assets/files/nezha.png">
  <link rel="preload" as="fetch" crossorigin href="assets/files/spearman.png">
  <link rel="preload" as="fetch" crossorigin href="assets/files/archer.png">
  <link rel="preload" as="fetch" crossorigin href="assets/scene/gate.png">
  <link rel="preload" as="fetch" crossorigin href="assets/scene/screen.jpg">
  <link rel="preload" as="fetch" crossorigin href="assets/files/wukong.json">
  <link rel="preload" as="fetch" crossorigin href="assets/files/nezha.json">
  <link rel="preload" as="fetch" crossorigin href="assets/files/dummy.png">
  <link rel="preload" as="fetch" crossorigin href="assets/files/spearman.json">
  <link rel="preload" as="fetch" crossorigin href="assets/files/archer.json">
  <link rel="preload" as="fetch" crossorigin href="assets/scene/wisp.png">
  <link rel="preload" as="fetch" crossorigin href="assets/files/dummy.json">
  <link rel="preload" as="fetch" crossorigin href="assets/scene/tiles.png">
  <link rel="preload" as="fetch" crossorigin href="assets/scene/ring.png">
  <link rel="preload" as="fetch" crossorigin href="assets/scene/pennant.png">
  <link rel="preload" as="fetch" crossorigin href="assets/scene/spark.png">
  <link rel="preload" as="fetch" crossorigin href="assets/scene/arrow.png">
  <link rel="preload" as="fetch" crossorigin href="assets/files/wukong.atlas">
  <link rel="preload" as="fetch" crossorigin href="assets/files/nezha.atlas">
  <link rel="preload" as="fetch" crossorigin href="assets/files/spearman.atlas">
  <link rel="preload" as="fetch" crossorigin href="assets/files/archer.atlas">
  <link rel="preload" as="fetch" crossorigin href="assets/scene/chaff.png">
  <link rel="preload" as="fetch" crossorigin href="assets/files/dummy.atlas">
  <!-- End of what is fetched at once. -->
  <!-- What the bare names in src/ and vendor/ stand for. The packed game does not need it; ?dev does. -->
  <script type="importmap">
    {
      "imports": {
        "#egret-keyboard-input": "./vendor/engine/dist/keyboardInput.js",
        "#egret-pointer-input": "./vendor/engine/dist/pointerInput.js",
        "#egret-textured-frame-state": "./vendor/engine/dist/internal/texturedFrameState.js",
        "@egret/contracts": "./vendor/contracts/dist/index.js",
        "@egret/contracts/resources": "./vendor/contracts/dist/resources/index.js",
        "@egret/engine": "./vendor/engine/dist/index.js",
        "@egret/engine/audio": "./vendor/engine/dist/audio.js",
        "@egret/engine/camera": "./vendor/engine/dist/camera.js",
        "@egret/engine/input/gamepad": "./vendor/engine/dist/gamepad.js",
        "@egret/engine/particles": "./vendor/engine/dist/particles.js",
        "@egret/engine/resources": "./vendor/engine/dist/resources.js",
        "@egret/engine/text": "./vendor/engine/dist/text.js",
        "@egret/engine/tilemap": "./vendor/engine/dist/tilemap.js",
        "@egret/engine/web/audio": "./vendor/engine/dist/web/audio.js",
        "@egret/engine/web/game": "./vendor/engine/dist/web/game.js",
        "@egret/engine/web/gamepad": "./vendor/engine/dist/web/gamepad.js",
        "@egret/engine/webgl2": "./vendor/engine/dist/web/webgl2.js",
        "@egret/engine/webgpu": "./vendor/engine/dist/web/webgpu.js",
        "@egret/runtime": "./vendor/runtime/dist/index.js",
        "@egret/runtime/input": "./vendor/runtime/dist/input/index.js",
        "@egret/runtime/text": "./vendor/runtime/dist/text/index.js",
        "@egret/spine": "./vendor/spine/dist/index.js",
        "@esotericsoftware/spine-core": "./vendor/spine-core/dist/index.js",
        "robust-predicates": "./vendor/robust-predicates/index.js"
      }
    }
  </script>
</head>
<body>
  <main class="booth" id="booth">
    <canvas id="stage" tabindex="0" aria-label="皮影戏台"></canvas>

    <div class="hud" id="hud" hidden>
      <p class="banner" data-zh="灯影　闹天宫" data-en="Lantern Shadows">灯影　闹天宫</p>
      <div class="peaches" id="peaches" role="img" aria-label="桃"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="hairs" id="hairs"><span data-zh="毫毛" data-en="Hairs">毫毛</span><i><b id="hairs-fill"></b></i><em data-zh="按 I 身外身" data-en="press I">按 I 身外身</em></div>
      <p class="tally-line"><span id="soldiers"></span><span id="clock">0:00</span></p>
      <div class="foe" id="boss" hidden><span data-zh="哪吒" data-en="Nezha">哪吒</span><i><b id="boss-health"></b></i></div>
      <p class="notice" id="notice" role="status" hidden></p>
      <output class="combo" id="combo" hidden><b id="combo-count">0</b><span data-zh="连击" data-en="hits">连击</span></output>
      <p class="best" id="best" hidden></p>
      <nav class="tools">
        <a href="../" data-zh="返回" data-en="Back">返回</a>
        <button type="button" id="lang">EN</button>
        <button type="button" id="mute" aria-pressed="false" data-zh="锣鼓" data-en="Sound">锣鼓</button>
        <button type="button" id="full" data-zh="全屏" data-en="Full screen">全屏</button>
      </nav>
      <p class="crowd" id="crowd" hidden></p>
      <p class="keys" id="keys"></p>
      <div class="pads" aria-hidden="true">
        <div class="pad-move"><button type="button" data-hold="left">◀</button><button type="button" data-hold="right">▶</button></div>
        <div class="pad-act"><button type="button" data-hold="special" data-zh="变" data-en="Hairs">变</button><button type="button" data-hold="dash" data-zh="云" data-en="Roll">云</button><button type="button" data-hold="attack" data-zh="棍" data-en="Staff">棍</button><button type="button" data-hold="jump" data-zh="跳" data-en="Jump">跳</button></div>
      </div>
      <button type="button" class="paused" id="paused" hidden data-zh="暂停　按 P 继续" data-en="Paused. Press P to go on">暂停　按 P 继续</button>
      <p class="trouble" id="trouble" role="alert" hidden></p>
      <pre class="stats" id="stats" hidden></pre>
    </div>

    <section class="result" id="result" hidden>
      <div class="playbill">
        <p class="act" data-zh="第一幕　南天门　落幕" data-en="Act one, the Southern Gate: curtain">第一幕　南天门　落幕</p>
        <p class="seal" id="rank">S</p>
        <dl class="tally" id="tally"></dl>
        <button type="button" class="gong small" id="again"><span data-zh="再演" data-en="Again">再演</span></button>
      </div>
    </section>

    <section class="curtain" id="curtain">
      <div class="playbill">
        <h1><span data-zh="灯影" data-en="Lantern Shadows">灯影</span><em data-zh="闹天宫" data-en="Havoc in Heaven">闹天宫</em></h1>
        <p class="act" data-zh="第一幕　南天门　哪吒拦路" data-en="Act one: the Southern Gate, and Nezha in the way">第一幕　南天门　哪吒拦路</p>
        <button type="button" class="gong" id="start" disabled><span data-zh="开锣" data-en="Begin">开锣</span></button>
        <button type="button" class="aside" id="start-boss" disabled data-zh="只看压轴：直接会哪吒" data-en="Only the finale: straight to Nezha">只看压轴：直接会哪吒</button>
        <i class="filling" id="filling"><b></b></i>
        <p class="status" id="status" data-zh="正在挂灯、理线……" data-en="Hanging the lamp…">正在挂灯、理线……</p>
      </div>
    </section>
  </main>
  <!-- The game as tools/bundle.mjs packs it; with ?dev in the address, its modules as they are written. -->
  <script type="module">
    import(new URLSearchParams(location.search).has('dev') ? './src/main.mjs' : './build/lantern.js').catch(cause => {
      const status = document.getElementById('status');
      status.textContent = String(cause);
      status.classList.add('is-error');
    });
  </script>
</body>
</html>
