<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#182425">
  <link rel="icon" href="data:,">
  <title>封神 · 西岐战纪</title>
  <link rel="preload" href="./assets/title.webp" as="image">
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
{
  "imports": {
    "@egret/contracts": "./vendor/contracts/dist/index.js",
    "@egret/runtime": "./vendor/runtime/dist/index.js",
    "@egret/contracts/resources": "./vendor/contracts/dist/resources/index.js",
    "@egret/engine": "./vendor/engine/dist/index.js",
    "@egret/runtime/text": "./vendor/runtime/dist/text/index.js",
    "@egret/engine/text": "./vendor/engine/dist/text.js",
    "@egret/runtime/input": "./vendor/runtime/dist/input/index.js",
    "#egret-pointer-input": "./vendor/engine/dist/pointerInput.js",
    "#egret-keyboard-input": "./vendor/engine/dist/keyboardInput.js",
    "robust-predicates": "./vendor/robust-predicates/index.js",
    "#egret-textured-frame-state": "./vendor/engine/dist/internal/texturedFrameState.js",
    "@egret/engine/input/hover": "./vendor/engine/dist/hover.js",
    "@egret/engine/web/game": "./vendor/engine/dist/web/game.js",
    "@egret/engine/webgl2": "./vendor/engine/dist/web/webgl2.js",
    "@egret/engine/webgpu": "./vendor/engine/dist/web/webgpu.js"
  }
}
  </script>
  <script type="module" src="./src/main.mjs"></script>
</head>
<body>
<main id="game-shell">
  <div id="field" aria-label="游戏场景"><canvas id="stage" aria-label="游戏地图"></canvas></div>
  <section id="title" aria-labelledby="game-title">
    <div class="title-content">
      <p class="chapter">封神演义 · 第一章</p>
      <h1 id="game-title"><span>封神</span>西岐战纪</h1>
      <p class="title-line">西岐城外，古道有祟。玄甲奉令出城。</p>
      <div class="title-actions">
        <button class="primary" id="new-game" disabled>初入西岐</button>
        <button id="continue-game" hidden>继续战纪</button>
      </div>
      <label class="slot">存档 <select id="slot"><option value="1">一</option><option value="2">二</option><option value="3">三</option></select></label>
      <p id="title-status" role="status">正在准备西岐城…</p>
    </div>
  </section>
  <div id="hud" hidden>
    <section class="player" aria-label="玄甲状态">
      <div class="player-top"><b>玄甲</b><span id="level"></span><span id="wallet"></span></div>
      <div class="meter hp"><i id="hp-fill"></i><span id="hp-text"></span></div>
      <div class="meter xp"><i id="xp-fill"></i></div>
    </section>
    <section class="task" aria-label="任务">
      <header class="task-heading"><strong id="map-name"></strong><button id="quest-toggle" type="button" aria-expanded="false" aria-controls="quest-text">详情</button></header>
      <div id="quest-title"></div>
      <p id="quest-text"></p>
      <button id="track" hidden></button>
    </section>
    <div class="utility"><button id="inventory">行囊 <kbd>B</kbd></button><button id="pause">暂停 <kbd>Esc</kbd></button></div>
    <section class="boss" id="boss-hud" hidden><b>蚀甲邪将</b><div class="meter hp"><i id="boss-fill"></i></div></section>
    <aside id="notice" role="status" hidden></aside>
    <aside id="interactions">
      <button class="primary" id="interact" hidden></button>
      <button id="pickup" hidden></button>
    </aside>
    <div id="keyboard-help">WASD / 方向键移动 · 点击地面寻路 · 点击敌人接战</div>
    <div id="joystick" aria-label="移动摇杆"><span></span></div>
    <div class="actions" aria-label="战斗操作">
      <button id="potion"><span aria-hidden="true">✚</span>回春散 <b id="potion-count"></b><kbd>1</kbd></button>
      <button id="artifact" disabled><span aria-hidden="true">◎</span>乾坤圈 <b id="artifact-clock"></b><kbd>Q</kbd></button>
      <button id="attack"><span aria-hidden="true">⚔</span>攻击 <kbd>空格</kbd></button>
    </div>
  </div>
  <div class="overlay" id="inventory-panel" hidden>
    <section class="card" role="dialog" aria-modal="true" aria-labelledby="inventory-title">
      <header><div><div class="chapter">玄甲</div><h2 id="inventory-title">行囊与装备</h2></div><button id="close-inventory" aria-label="关闭行囊">关闭</button></header>
      <p id="equipment-stats"></p><ul id="equipment-list"></ul>
    </section>
  </div>
  <div class="overlay" id="pause-panel" hidden>
    <section class="card compact" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <h2 id="pause-title">暂歇</h2>
      <p id="save-status" role="status"></p>
      <div class="menu"><button class="primary" id="resume">继续战斗</button><button id="save">保存进度</button><button id="audio">音效开启</button><button id="return-title">返回标题</button></div>
    </section>
  </div>
  <div class="overlay" id="death-panel" hidden>
    <section class="card compact" role="dialog" aria-modal="true" aria-labelledby="death-title">
      <p class="chapter">古道遇险</p><h2 id="death-title">玄甲力竭</h2>
      <p>已拾取的装备与任务进度随你回城。</p>
      <button class="primary" id="retry">返回西岐</button>
    </section>
  </div>
  <div class="overlay" id="victory-panel" hidden>
    <section class="card compact" role="dialog" aria-modal="true" aria-labelledby="victory-title">
      <p class="chapter">古道除祟</p><h2 id="victory-title">邪将已伏</h2>
      <p>拾取掉落的镇邪印，回西岐向姜尚复命。</p>
      <button class="primary" id="victory-continue">返回战场</button>
    </section>
  </div>
  <div class="overlay" id="new-confirm" hidden>
    <section class="card compact" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title">覆盖此存档？</h2><p>选择另一个存档位可保留原来的战纪。</p>
      <div class="menu"><button class="primary" id="new-cancel">返回</button><button id="new-overwrite">重新出发</button></div>
    </section>
  </div>
  <noscript>请启用 JavaScript 后进入西岐。</noscript>
</main>
</body>
</html>
