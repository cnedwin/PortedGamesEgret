<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <title>千机巧匠 · Mechanism City</title>
  <meta name="description" content="墨家机关城被封，用机关弩把弹丸射进城里，借木块、绳索、跷跷板和滚石连锁触发，打开每一关的机关锁。基于新白鹭引擎独立开发的 2D 物理弹射解谜 Demo。">
  <meta name="theme-color" content="#0d1418">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <!-- The engine is a copy inside this folder (vendor/SOURCE.md); this map is vendor/importmap.json, pasted in. -->
  <script type="importmap">
{
  "imports": {
    "@egret/contracts": "./vendor/contracts/dist/index.js",
    "@egret/runtime": "./vendor/runtime/dist/index.js",
    "@egret/contracts/resources": "./vendor/contracts/dist/resources/index.js",
    "@egret/engine": "./vendor/engine/dist/index.js",
    "@egret/engine/physics2d": "./vendor/engine/dist/physics2d.js",
    "@egret/engine/tilemap": "./vendor/engine/dist/tilemap.js",
    "@egret/engine/camera": "./vendor/engine/dist/camera.js",
    "@egret/engine/particles": "./vendor/engine/dist/particles.js",
    "@egret/engine/bitmapfont": "./vendor/engine/dist/bitmapfont.js",
    "@egret/runtime/ui": "./vendor/runtime/dist/ui/index.js",
    "@egret/engine/ui": "./vendor/engine/dist/ui/index.js",
    "@egret/engine/ui/semantics": "./vendor/engine/dist/semantics.js",
    "@egret/engine/web/semantics": "./vendor/engine/dist/web/semantics.js",
    "@egret/engine/kit": "./vendor/engine/dist/kit.js",
    "@egret/engine/web/kit": "./vendor/engine/dist/web/kit.js",
    "@egret/engine/audio": "./vendor/engine/dist/audio.js",
    "@egret/engine/web/audio": "./vendor/engine/dist/web/audio.js",
    "@egret/engine/video": "./vendor/engine/dist/video.js",
    "@egret/engine/web/video": "./vendor/engine/dist/web/video.js",
    "@egret/runtime/text": "./vendor/runtime/dist/text/index.js",
    "@egret/engine/text": "./vendor/engine/dist/text.js",
    "@egret/runtime/input": "./vendor/runtime/dist/input/index.js",
    "#egret-pointer-input": "./vendor/engine/dist/pointerInput.js",
    "#egret-keyboard-input": "./vendor/engine/dist/keyboardInput.js",
    "robust-predicates": "./vendor/robust-predicates/index.js",
    "#egret-textured-frame-state": "./vendor/engine/dist/internal/texturedFrameState.js",
    "@egret/engine/input/hover": "./vendor/engine/dist/hover.js",
    "@egret/engine/web/game": "./vendor/engine/dist/web/game.js",
    "@egret/engine/web/hover": "./vendor/engine/dist/web/hover.js",
    "@egret/engine/web/text": "./vendor/engine/dist/web/text.js"
  }
}
</script>
</head>
<body>
  <main id="frame">
    <div id="playfield">
      <canvas id="stage" aria-label="千机巧匠 Mechanism City"></canvas>
    </div>
    <section id="portrait-controls" aria-label="竖屏操作">
      <div class="touch-heading">
        <strong id="touch-level">机关城</strong>
        <span id="touch-ammo"></span>
      </div>
      <label class="touch-power" for="touch-power">
        <span>力度 <output id="touch-power-value">0</output></span>
        <input type="range" id="touch-power" min="0" max="100" step="1">
      </label>
      <button type="button" class="touch-fire" data-touch-action="fire">发射</button>
      <div class="touch-clue-row">
        <p id="touch-clue" aria-live="polite"></p>
        <button type="button" data-touch-action="closeHint" aria-label="关闭提示" hidden>关闭</button>
      </div>
      <div class="touch-options">
        <button type="button" data-touch-action="overview">全景</button>
        <button type="button" data-touch-action="restart">重来</button>
        <button type="button" data-touch-action="menu">选关</button>
        <button type="button" data-touch-action="hint">提示</button>
        <button type="button" data-touch-action="settings">设置</button>
      </div>
    </section>
  </main>
  <noscript>这个游戏需要 JavaScript。· This game needs JavaScript.</noscript>
  <script type="module" src="src/main.mjs"></script>
</body>
</html>
