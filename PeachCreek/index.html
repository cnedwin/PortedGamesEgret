<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <title>桃溪县令 · Magistrate of Peach Creek</title>
  <meta name="description" content="桃溪县令：宋朝背景的治愈系放置经营。作为县令修屋开田、规划坊区、访贤、开采、经商、守城，把下县治成一州。基于新白鹭引擎独立开发的游戏 Demo。">
  <meta name="theme-color" content="#f4efe1">
  <link rel="icon" href="data:,">
  <link rel="preload" as="image" href="assets/title-watercolor.webp">
  <link rel="stylesheet" href="style.css">
  <!-- The engine is a copy inside this folder (vendor/SOURCE.md); this map is vendor/importmap.json, pasted in. -->
  <script type="importmap">
    {
      "imports": {
        "@egret/contracts": "./vendor/contracts/dist/index.js",
        "@egret/runtime": "./vendor/runtime/dist/index.js",
        "@egret/contracts/resources": "./vendor/contracts/dist/resources/index.js",
        "@egret/engine": "./vendor/engine/dist/index.js",
        "@egret/engine/kit": "./vendor/engine/dist/kit.js",
        "@egret/engine/audio": "./vendor/engine/dist/audio.js",
        "@egret/engine/input/gamepad": "./vendor/engine/dist/gamepad.js",
        "@egret/runtime/text": "./vendor/runtime/dist/text/index.js",
        "@egret/engine/text": "./vendor/engine/dist/text.js",
        "@egret/runtime/input": "./vendor/runtime/dist/input/index.js",
        "#egret-pointer-input": "./vendor/engine/dist/pointerInput.js",
        "#egret-keyboard-input": "./vendor/engine/dist/keyboardInput.js",
        "robust-predicates": "./vendor/robust-predicates/index.js",
        "#egret-textured-frame-state": "./vendor/engine/dist/internal/texturedFrameState.js",
        "@egret/engine/input/hover": "./vendor/engine/dist/hover.js",
        "@egret/engine/play": "./vendor/engine/dist/web/play.js",
        "@egret/engine/web/kit": "./vendor/engine/dist/web/kit.js"
      }
    }
  </script>
</head>
<body>
  <main id="frame">
    <div id="back" class="layer"><canvas id="map" aria-hidden="true"></canvas></div>
    <div id="stage" aria-hidden="true" inert></div>
    <div id="ui" class="layer">
      <header id="top">
        <div class="titleRow"><h1 id="county"></h1><span id="term"></span><button id="almanac" type="button" class="icon"></button><div id="vitals"></div><button id="settingsButton" type="button" class="icon"></button></div>
        <ul id="resources" aria-live="off"></ul>
      </header>
      <div id="hits" role="group" tabindex="0"><div id="mapTargets"></div></div>
      <button id="taxBubble" type="button" hidden></button>
      <aside id="goalCard" hidden><span class="goalLabel"></span><b id="goalText"></b><button id="claimButton" type="button" hidden></button></aside>
      <button id="raidBanner" type="button" hidden></button>
      <button id="petitionCall" type="button" hidden></button>
      <div id="mapTools" hidden>
        <button id="countyFocus" type="button"></button>
        <button id="overview" type="button"></button>
        <button id="frontiers" type="button"></button>
        <button id="zoomOut" type="button">−</button>
        <button id="zoomIn" type="button">+</button>
      </div>
      <nav id="tabs" role="tablist"></nav>
      <section id="sheet" role="dialog" aria-modal="false" hidden><button class="sheetClose" type="button"></button><div id="sheetBody"></div></section>
      <div id="toasts" aria-live="polite"></div>

      <section id="title" class="screen" hidden>
        <div class="seal" aria-hidden="true"></div>
        <h2 id="titleName"></h2>
        <p id="tagline"></p>
        <p class="notice" hidden></p>
        <div class="titleButtons"><button id="startButton" class="primary" type="button"></button><button id="titleSettings" type="button"></button><button id="languageButton" type="button"></button></div>
        <p class="demo" id="demoLine"></p>
      </section>
      <section id="saveSlots" class="dialog" role="dialog" aria-modal="true" aria-labelledby="saveSlotsTitle" hidden>
        <h2 id="saveSlotsTitle"></h2>
        <div id="saveSlotList"></div>
        <button id="closeSaveSlots" class="closeButton" type="button"></button>
      </section>
      <section id="away" class="dialog" role="dialog" aria-labelledby="awayTitle" hidden><h2 id="awayTitle"></h2><div id="awayBody"></div><button id="awayOk" class="primary" type="button"></button></section>
      <section id="settings" class="dialog" role="dialog" aria-labelledby="settingsTitle" hidden><h2 id="settingsTitle"></h2><div class="settingsList"></div><button class="closeButton" type="button"></button><button id="returnToTitle" type="button" hidden></button></section>
      <p id="loading" class="loading">桃溪 · Peach Creek</p>
    </div>
    <span id="rotateHint"></span>
  </main>
  <noscript>这个游戏需要 JavaScript · This game needs JavaScript.</noscript>
  <script type="module" src="src/main.mjs"></script>
</body>
</html>
