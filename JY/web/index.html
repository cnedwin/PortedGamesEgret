<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>金庸群侠传 · 白鹭 Web Demo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./jyx2/ui/world-navigation.css">
</head>
<body>
  <main>
    <section id="title-screen" class="title-screen" aria-labelledby="title-logo" hidden>
      <picture class="title-landscape" aria-hidden="true">
        <img class="title-art" src="./title-art/wuxia-dawn.webp" alt="" width="1536" height="1024" fetchpriority="high">
      </picture>
      <div class="title-content">
        <h1 id="title-logo">金庸群俠傳</h1>
        <p class="title-edition">白鷺引擎 · 武俠遊戲 Demo</p>
        <nav class="title-actions" aria-label="主選單">
          <button type="button" class="title-journey" data-title-action="continue"><span>繼續遊戲</span><span aria-hidden="true">›</span></button>
          <button type="button" class="title-journey" data-title-action="new"><span>開始新遊戲</span><span aria-hidden="true">›</span></button>
          <button type="button" class="title-library" data-title-action="load">讀取存檔</button>
          <button type="button" class="title-library" data-title-action="settings">設定</button>
          <button type="button" class="title-library" data-title-action="help">操作說明</button>
        </nav>
        <p id="title-status" class="title-status" role="status"></p>
      </div>
      <dialog id="title-dialog" class="title-dialog" aria-labelledby="title-dialog-heading"></dialog>
    </section>
    <div id="play-screen">
    <header class="masthead">
      <div>
        <p class="kicker">白鷺引擎 · WEB DEMO</p>
        <h1>金庸群侠传</h1>
      </div>
      <span class="renderer">WEBGL2</span>
    </header>
    <section class="screen" aria-label="原作场景">
      <header class="scene-bar">
        <span id="scene-name">载入原作场景</span>
        <span id="coordinates">—</span>
      </header>
      <div class="viewport">
        <canvas id="game" width="640" height="360" tabindex="0" aria-label="游戏画面，方向键或 WASD 移动，Enter 对话"></canvas>
        <canvas id="battle-grid" class="battle-grid" aria-hidden="true" hidden></canvas>
        <div id="notice" class="notice" role="status">正在读取原作地图与贴图…</div>
        <section id="battle-result" class="notice battle-result" aria-labelledby="battle-result-text" hidden>
          <div>
            <p id="battle-result-text" role="status"></p>
            <button type="button" id="battle-continue" class="battle-primary" aria-keyshortcuts="Enter Space">繼續</button>
          </div>
        </section>
        <section id="battle-menu" class="battle-menu" aria-label="戰鬥選單" hidden></section>
      </div>
      <section id="mobile-dialogue" class="mobile-dialogue" aria-label="劇情對話" hidden>
        <img class="mobile-dialogue-portrait" alt="" hidden>
        <div class="mobile-dialogue-copy">
          <header><strong class="mobile-dialogue-speaker"></strong><span class="mobile-dialogue-page"></span></header>
          <p aria-live="polite"></p>
        </div>
      </section>
      <section id="battle-controls" class="battle-controls" aria-label="戰鬥操作" hidden>
        <div class="battle-controls-phase" data-battle-controls-phase="active" hidden>
          <div class="battle-readout" aria-label="戰況">
            <div class="battle-readout-card">
              <div class="battle-readout-heading">
                <strong data-battle-fighter></strong><span class="battle-readout-state" data-battle-action aria-live="polite"></span>
              </div>
              <div class="battle-vitals">
                <div><span data-battle-hp></span><meter data-battle-meter="hp" min="0" max="1" value="0" aria-label="生命"></meter></div>
                <div><span data-battle-mp></span><meter data-battle-meter="mp" min="0" max="1" value="0" aria-label="內力"></meter></div>
              </div>
            </div>
            <div class="battle-readout-card" data-battle-nearby>
              <div class="battle-readout-heading">
                <strong data-battle-enemy></strong><span class="battle-readout-state" data-battle-enemy-action></span>
              </div>
              <div class="battle-vitals battle-vitals-enemy">
                <div><span data-battle-enemy-hp></span><meter data-battle-meter="enemy" min="0" max="1" value="0" aria-label="近敵生命"></meter></div>
              </div>
            </div>
          </div>
          <div class="battle-dpad" role="group" aria-label="戰場游標">
            <button type="button" data-battle-command="KeyW" aria-label="游標上移" aria-keyshortcuts="W ArrowUp">↑</button>
            <button type="button" data-battle-command="KeyA" aria-label="游標左移" aria-keyshortcuts="A ArrowLeft">←</button>
            <button type="button" data-battle-command="KeyS" aria-label="游標下移" aria-keyshortcuts="S ArrowDown">↓</button>
            <button type="button" data-battle-command="KeyD" aria-label="游標右移" aria-keyshortcuts="D ArrowRight">→</button>
          </div>
          <div class="battle-skill" role="group" aria-label="武學">
            <button type="button" data-battle-command="KeyQ" aria-label="上一招武學" aria-keyshortcuts="Q">‹</button>
            <output data-battle-skill></output>
            <button type="button" data-battle-command="KeyF" aria-label="下一招武學" aria-keyshortcuts="F">›</button>
          </div>
          <div class="battle-actions" role="group" aria-label="回合指令">
            <button type="button" data-battle-command="KeyM" aria-keyshortcuts="M" aria-pressed="false">移動 <kbd aria-hidden="true">M</kbd></button>
            <button type="button" class="battle-primary" data-battle-command="KeyI" aria-keyshortcuts="I" aria-pressed="false">武學 <kbd aria-hidden="true">I</kbd></button>
            <button type="button" class="battle-primary" data-battle-command="Enter" aria-keyshortcuts="Enter Space">確定 <kbd aria-hidden="true">Enter</kbd></button>
            <button type="button" data-battle-command="KeyB" aria-keyshortcuts="B">藥品／暗器 <kbd aria-hidden="true">B</kbd></button>
            <button type="button" data-battle-command="KeyT" aria-keyshortcuts="T">醫療／用毒 <kbd aria-hidden="true">T</kbd></button>
            <button type="button" data-battle-command="KeyV" aria-keyshortcuts="V">察看 <kbd aria-hidden="true">V</kbd></button>
            <button type="button" data-battle-command="KeyL" aria-keyshortcuts="L">休息 <kbd aria-hidden="true">L</kbd></button>
            <button type="button" data-battle-command="Tab" aria-keyshortcuts="Tab" aria-pressed="false">自動 <kbd aria-hidden="true">Tab</kbd></button>
            <button type="button" data-battle-command="KeyR" aria-keyshortcuts="R">重開</button>
            <button type="button" data-battle-command="Escape" aria-keyshortcuts="Escape">認輸</button>
          </div>
        </div>
        <div class="battle-controls-phase battle-controls-confirm" data-battle-controls-phase="confirm" hidden>
          <button type="button" data-battle-command="Escape">取消</button>
          <button type="button" class="battle-primary" data-battle-command="Enter">確定</button>
        </div>
      </section>
      <footer class="scene-bar"><span id="hint">方向键或 WASD 移动</span><span id="event-marker"></span></footer>
    </section>
    <footer class="controls">
      <span class="keyboard-guide"><kbd>方向鍵</kbd> <kbd>WASD</kbd> 移動 · <kbd>Enter</kbd> 對話 · <kbd>B</kbd> 背包 · <kbd>Esc</kbd> 選單</span>
      <div id="explore-controls" class="explore-controls">
        <div id="explore-dpad" class="explore-dpad" role="group" aria-label="移動方向">
          <button type="button" data-map-command="ArrowUp" aria-label="向上移動">↑</button>
          <button type="button" data-map-command="ArrowLeft" aria-label="向左移動">←</button>
          <button type="button" data-map-command="ArrowDown" aria-label="向下移動">↓</button>
          <button type="button" data-map-command="ArrowRight" aria-label="向右移動">→</button>
        </div>
        <button type="button" data-map-command="Enter" aria-keyshortcuts="Enter">對話</button>
        <button type="button" data-map-command="KeyB" aria-keyshortcuts="B">背包</button>
        <button type="button" id="open-menu" data-map-command="Escape" aria-keyshortcuts="Escape" disabled>江湖選單</button>
      </div>
    </footer>
    </div>
  </main>
  <script type="module" src="./main.mjs"></script>
</body>
</html>
