<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#171f1b">
  <title>JY · 金庸群侠传致敬 Demo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./trial.css">
</head>
<body>
  <main class="play launcher">
    <header class="masthead">
      <div>
        <p class="engine">新白鹭引擎 · World3D</p>
        <h1>金庸群侠传</h1>
        <p class="launcher-intro">探索江湖、招募队友，以经典回合制迎战群侠。</p>
      </div>
    </header>
    <section id="4in1" class="pack-entry" aria-labelledby="pack-heading">
      <h2 id="pack-heading">完整版</h2>
      <div class="pack-actions">
        <button id="jy-play-full" type="button" hidden>进入完整版</button>
        <button id="jy-cancel-import" type="button" class="quiet" hidden>取消</button>
      </div>
      <p id="jy-import-status" class="pack-status" role="status" aria-live="polite">正在检查游戏数据…</p>
      <progress id="jy-import-progress" aria-label="游戏数据准备进度" hidden></progress>
      <details id="jy-local-import" open>
        <summary>从本机导入</summary>
        <p>请选择自备的 4in1 压缩包或解压后的 <code>game</code> 文件夹。 <a href="https://github.com/scarsty/kys-cpp#readme">原项目资源说明</a></p>
        <div class="pack-actions">
          <button id="jy-choose-archive" type="button">选择 4in1 压缩包</button>
          <button id="jy-choose-folder" type="button" class="quiet">选择文件夹</button>
          <input id="jy-archive" type="file" accept=".7z" hidden>
          <input id="jy-folder" type="file" webkitdirectory multiple hidden>
        </div>
      </details>
    </section>
    <footer><p>非商业演示。游戏数据和存档保存在当前浏览器。</p><a href="./ASSETS.md">素材与版权</a></footer>
  </main>
  <script type="module" src="./browser/import-ui.mjs"></script>
</body>
</html>
