<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <title>漕河守闸 · Canal Watch</title>
  <meta name="description" content="漕河守闸：基于新白鹭引擎独立开发的塔防游戏 Demo。守住汴河上的城门十二波，四种塔、两道水闸、中英文。 · Canal Watch: a tower defence demo made on its own with the new Egret engine.">
  <meta name="theme-color" content="#2b2924">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <!-- The engine is a copy inside this folder (vendor/SOURCE.md); this map is vendor/importmap.json, pasted in. -->
  <script type="importmap">
    {
      "imports": {
        "@egret/contracts": "./vendor/contracts/dist/index.js",
        "@egret/runtime": "./vendor/runtime/dist/index.js",
        "@egret/contracts/resources": "./vendor/contracts/dist/resources/index.js",
        "@egret/engine": "./vendor/engine/dist/index.js",
        "@egret/engine/kit": "./vendor/engine/dist/kit.js",
        "@egret/engine/audio": "./vendor/engine/dist/audio.js",
        "@egret/engine/input/gamepad": "./vendor/engine/dist/gamepad.js",
        "@egret/runtime/text": "./vendor/runtime/dist/text/index.js",
        "@egret/engine/text": "./vendor/engine/dist/text.js",
        "@egret/runtime/input": "./vendor/runtime/dist/input/index.js",
        "#egret-pointer-input": "./vendor/engine/dist/pointerInput.js",
        "#egret-keyboard-input": "./vendor/engine/dist/keyboardInput.js",
        "robust-predicates": "./vendor/robust-predicates/index.js",
        "#egret-textured-frame-state": "./vendor/engine/dist/internal/texturedFrameState.js",
        "@egret/engine/input/hover": "./vendor/engine/dist/hover.js",
        "@egret/engine/play": "./vendor/engine/dist/web/play.js",
        "@egret/engine/web/kit": "./vendor/engine/dist/web/kit.js"
      }
    }
  </script>
</head>
<body>
  <main id="frame">
    <header id="bar" hidden>
      <p class="stat" id="silver"></p>
      <p class="stat" id="lives"></p>
      <p class="stat" id="wave"></p>
      <div class="tools">
        <button type="button" id="gate0" data-gate="0"></button>
        <button type="button" id="gate1" data-gate="1"></button>
        <button type="button" id="call" class="strong"></button>
        <button type="button" id="speed"></button>
        <button type="button" id="menuButton"></button>
      </div>
    </header>
    <div id="field">
      <canvas id="ground" aria-hidden="true"></canvas>
      <div id="plots"></div>
      <div id="picker" role="dialog" hidden></div>
    </div>
    <p id="keys" hidden></p>
    <section id="title" class="panel" hidden></section>
    <section id="menu" class="panel" role="dialog" aria-modal="true" hidden></section>
    <section id="end" class="panel" role="dialog" aria-modal="true" hidden></section>
    <p id="say" class="quiet" aria-live="polite"></p>
    <p id="loading">载入中 · Loading</p>
  </main>
  <noscript>这个游戏需要 JavaScript · This game needs JavaScript.</noscript>
  <script type="module" src="src/main.mjs"></script>
</body>
</html>
